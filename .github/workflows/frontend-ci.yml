name: Frontend CI

on:
  push:
    branches:
      - main
      - feature/hearding
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Angular 17 build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.20.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production application
        run: npm run build:local

      - name: Run unit tests
        run: npm test -- --no-progress --browsers=ChromeHeadless
